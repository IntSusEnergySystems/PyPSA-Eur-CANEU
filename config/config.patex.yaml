# PatEx → PyPSA-Eur coupled run (CAN Europe PAC 2.0 scenario).
# Run: pixi run snakemake --configfile config/config.patex.yaml -c4

run:
  name: patex-pac2

foresight: myopic
# Must be a subset of the horizons exported by `patex-pypsa export-coupling`.
planning_horizons: [2030, 2040, 2050]

patex:
  enable: true
  coupling_dir: ../PATEX2PYPSA/runs/pac2   # contains pypsa_inputs/
  # Not in PatEx (dataset 47.x.4): keep the PyPSA-Eur preprocessed demands.
  fallback_countries: [AL, BA, CH, GB, ME, MK, "NO", RS, XK]  # "NO": YAML reads NO as false
  energy_totals: true
  industry: true          # carriers, feedstock gas and process emissions
  co2_intensity: true     # gas / oil / coal CO2 intensity from PatEx's factors
  district_heating: true  # district heating share per country
  base_load: true
  # PatEx convention: plastics end-of-life emit CO2 only when burned in waste CHPs
  # (talking point with Climact / CAN).
  plastics_eol_co2: false

industry:
  waste_to_energy: true   # waste CHPs burn non-recycled plastics (CO2 counted)

# Nuclear (T34): one link per reactor from data/nuclear_fleet.csv (official sources),
# no duplicate generators; one 10-year extension (model's choice, at fixed O&M cost)
# unless the official end date is already an extension; gone within 4 years of its end;
# 50 years where no official end date exists (user, 2026-11-07); must-run 0.10 below
# the country availability.
nuclear_fleet:
  enable: true
  default_lifetime: 50
  must_run_margin: 0.10

# Gross imports per fuel capped at PatEx's, summed over the modelled countries
# (patex.import_limits); biogas and bioliquids imports added for that.
import_limits:
  enable: true
  bio_imports: [biogas, bioliquids]

sector:
  # Imports (T29): PyPSA-Eur's import options on, so that every fuel PatEx imports
  # can be imported; caps from PatEx (`import_limits` above). Prices: upstream's.
  imports:
    enable: true
  solid_biomass_import:
    enable: true
  # PatEx demands already embed renovation and efficiency: do not let
  # PyPSA-Eur reduce them a second time.
  reduce_space_heat_exogenously: false
  # Agriculture machinery: the export already puts PatEx's electric machinery in
  # `total agriculture electricity` and leaves only liquid fuel in `total
  # agriculture machinery`, so none of it is electrified again here.
  agriculture_machinery_electric_share: 0
  agriculture_machinery_oil_share: 1
  # Land transport: for the PatEx countries, the EV, fuel-cell and oil loads are
  # PatEx's energy per fuel on PyPSA-Eur's hourly profile, and the EV fleet is
  # PatEx's (patex_pypsa.transport). `sector.land_transport_*_share` then only
  # apply to the fallback countries (PyPSA-Eur defaults).
  # District heating: `sector.district_heating.potential/progress` only apply to
  # the fallback countries. Changes and reasons: PATEX_PyPSA/MODEL_CHANGES.md.

plotting:
  tech_colors:
    gas feedstock for industry: "#a0522d"  # PatEx soft-link: feedstock gas load
    land transport gas: "#a35d2c"
    oil for industry: "#7d6b4f"  # PatEx soft-link: oil burnt in industry (T24)
    rail electricity: "#7ab33a"
    aviation electricity: "#5fa3c7"
    shipping electricity: "#4f7fa8"
    H2 for rail: "#8b4f7d"
    gas for cooking: "#c27c4e"  # PatEx soft-link: non-electric cooking (T18)
    oil for cooking: "#8f7a5a"
    coal for cooking: "#6b5a4a"
    solid biomass for cooking: "#9aa04a"
    H2 for cooking: "#b07aa1"
    urban central heat losses: "#d9826b"  # PatEx district heating losses (T19)
    heat losses: "#d9826b"  # same, as plot_summary names it
    gas production: "#c46a2f"  # domestic gas, split from the imports (T29)
    oil production: "#8a7560"
    coal production: "#5a4a3a"
    import H2: "#d9a3c8"
    import NH3: "#87d0e6"
    import methanol: "#c7a76b"
    import gas: "#e8a065"
    import oil: "#a69b8c"
    import biogas: "#9cc46a"
    import bioliquids: "#b5b86b"
    solid biomass import: "#7a9a4a"
  # no methanol map: PatEx has no methanol ships (Q14), so the methanol balance of
  # PatEx countries is empty and PyPSA's explore() fails on it
  balance_map_interactive:
    bus_carriers:
    - AC
    - co2_stored
    - gas
    - H2
    - oil
    - urban_central_heat
