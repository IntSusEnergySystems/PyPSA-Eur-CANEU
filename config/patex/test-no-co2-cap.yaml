# TECHNICAL TEST ONLY, not a scenario: no CO2 cap, to check the chain (PatEx demands
# for every horizon, solve, summaries, report) while the CO2 target is open (TODO T11).
# Add after a run overlay:
#   --configfile config/config.patex.yaml config/patex/levers2-be-lu-nl.yaml config/patex/test-no-co2-cap.yaml
# The default cap (45 % of 1990 in 2030) is infeasible for BE+LU+NL with levers 2.

run:
  name: patex-levers2-be-lu-nl-test-no-co2-cap

co2_budget:
  upper: null

clustering:
  temporal:
    # daily resolution: a fast chain test (solve of minutes), not for results
    averaging: 24h

plotting:
  # without a cap nothing is captured: the co2_stored balance is empty and PyPSA's
  # explore() fails on it
  balance_map_interactive:
    bus_carriers: [AC, gas, H2, oil, urban_central_heat]
