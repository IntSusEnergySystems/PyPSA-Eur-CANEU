# PatEx soft-link test, on top of the sector test:
# pixi run snakemake --configfile config/test/config.overnight.yaml config/test/config.patex.yaml -c4
# Needs a coupling bundle (`patex-pypsa export-coupling`) with horizon 2030.

run:
  name: "test-patex-overnight"

patex:
  enable: true
  coupling_dir: ../PATEX2PYPSA/runs/levers2

# EV flexibility (T16): Elia AdeqFlex 2025 "Current commitments" (defaults of the
# section): only the market share of the EV fleet is flexible (7 % in 2030, 18 % from
# 2040), the rest charges on Elia's curves; Elia plugged-in availability, 60 kWh, no V2G.
# PHEVs not counted in the fleet (patex.phev_fleet_factor: 0, default).
ev_flexibility:
  enable: true

# Nuclear (T34): one link per reactor from data/nuclear_fleet.csv (official sources),
# no duplicate generators; one 10-year extension (model's choice, at fixed O&M cost)
# unless the official end date is already an extension; gone within 4 years of its end;
# 50 years where no official end date exists (user, 2026-11-07); must-run 0.10 below
# the country availability.
nuclear_fleet:
  enable: true
  default_lifetime: 50
  must_run_margin: 0.10

# Gross imports per fuel capped at PatEx's, summed over the modelled countries
# (patex.import_limits); biogas and bioliquids imports added for that.
import_limits:
  enable: true
  bio_imports: [biogas, bioliquids]

# Cross-border capacity per border (T30, user 2026-11-09), in usable physical capacity
# (AC x s_max_pu + DC, existing and new): <= factor x (PyPSA-Eur's grid + TYNDP 2024
# transfer-capacity increase of the projects commissioned 2026..horizon). NTCs logged only.
interconnection_limits:
  enable: true
  factor:
    2030: 1.0
    2035: 1.5
    2040: 1.5
    2045: 1.5
    2050: 1.5

# Wind and solar caps per country (T31, user 2026-11-09): offshore wind at each
# country's offshore goal (TEN-E, January 2023) at every horizon, instead of PyPSA-Eur's
# 2 MW/km2 potential; 2030 capped at the capacity planned for 2030 (TYNDP 2026 National
# Trends+, final NECPs); after 2030 PyPSA-Eur's potentials, no build rate.
renewable_limits:
  enable: true
  planned_file: data/renewables_planned_2030.csv

# Geological CO2 storage (T32): per country from the IEA storage projects; total
# over all countries from PatEx (patex.co2_sequestration, default true).
co2_storage:
  enable: true

sector:
  # Imports (T29): PyPSA-Eur's import options on, so that every fuel PatEx imports
  # can be imported; caps from PatEx (`import_limits` above). Prices: upstream's.
  imports:
    enable: true
  solid_biomass_import:
    enable: true
  reduce_space_heat_exogenously: false
  agriculture_machinery_electric_share: 0
  agriculture_machinery_oil_share: 1

solving:
  check_objective:
    enable: false

plotting:
  tech_colors:
    gas feedstock for industry: "#a0522d"  # PatEx soft-link: feedstock gas load
    land transport gas: "#a35d2c"
    land transport EV inflexible: "#9fc4e8"  # EV charging outside the market share (T16)
    oil for industry: "#7d6b4f"  # PatEx soft-link: oil burnt in industry (T24)
    rail electricity: "#7ab33a"
    aviation electricity: "#5fa3c7"
    shipping electricity: "#4f7fa8"
    H2 for rail: "#8b4f7d"
    gas for cooking: "#c27c4e"  # PatEx soft-link: non-electric cooking (T18)
    oil for cooking: "#8f7a5a"
    coal for cooking: "#6b5a4a"
    solid biomass for cooking: "#9aa04a"
    H2 for cooking: "#b07aa1"
    urban central heat losses: "#d9826b"  # PatEx district heating losses (T19)
    heat losses: "#d9826b"  # same, as plot_summary names it
    gas production: "#c46a2f"  # domestic gas, split from the imports (T29)
    oil production: "#8a7560"
    coal production: "#5a4a3a"
    import H2: "#d9a3c8"
    import NH3: "#87d0e6"
    import methanol: "#c7a76b"
    import gas: "#e8a065"
    import oil: "#a69b8c"
    import biogas: "#9cc46a"
    import bioliquids: "#b5b86b"
    solid biomass import: "#7a9a4a"
  # no methanol map: PatEx has no methanol ships (Q14), so the methanol balance of
  # PatEx countries is empty and PyPSA's explore() fails on it
  balance_map_interactive:
    bus_carriers:
    - AC
    - co2_stored
    - gas
    - H2
    - oil
    - urban_central_heat
