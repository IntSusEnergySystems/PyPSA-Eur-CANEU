# PatEx soft-link test, on top of the sector test:
# pixi run snakemake --configfile config/test/config.overnight.yaml config/test/config.patex.yaml -c4
# Needs a coupling bundle (`patex-pypsa export-coupling`) with horizon 2030.

run:
  name: "test-patex-overnight"

patex:
  enable: true
  coupling_dir: ../PATEX2PYPSA/runs/levers2

# Gross imports per fuel capped at PatEx's, summed over the modelled countries
# (patex.import_limits); biogas and bioliquids imports added for that.
import_limits:
  enable: true
  bio_imports: [biogas, bioliquids]

sector:
  # Imports (T29): PyPSA-Eur's import options on, so that every fuel PatEx imports
  # can be imported; caps from PatEx (`import_limits` above). Prices: upstream's.
  imports:
    enable: true
  solid_biomass_import:
    enable: true
  reduce_space_heat_exogenously: false
  agriculture_machinery_electric_share: 0
  agriculture_machinery_oil_share: 1

solving:
  check_objective:
    enable: false

plotting:
  tech_colors:
    gas feedstock for industry: "#a0522d"  # PatEx soft-link: feedstock gas load
    land transport gas: "#a35d2c"
    oil for industry: "#7d6b4f"  # PatEx soft-link: oil burnt in industry (T24)
    rail electricity: "#7ab33a"
    aviation electricity: "#5fa3c7"
    shipping electricity: "#4f7fa8"
    H2 for rail: "#8b4f7d"
    gas for cooking: "#c27c4e"  # PatEx soft-link: non-electric cooking (T18)
    oil for cooking: "#8f7a5a"
    coal for cooking: "#6b5a4a"
    solid biomass for cooking: "#9aa04a"
    H2 for cooking: "#b07aa1"
    urban central heat losses: "#d9826b"  # PatEx district heating losses (T19)
    heat losses: "#d9826b"  # same, as plot_summary names it
    gas production: "#c46a2f"  # domestic gas, split from the imports (T29)
    oil production: "#8a7560"
    coal production: "#5a4a3a"
    import H2: "#d9a3c8"
    import NH3: "#87d0e6"
    import methanol: "#c7a76b"
    import gas: "#e8a065"
    import oil: "#a69b8c"
    import biogas: "#9cc46a"
    import bioliquids: "#b5b86b"
    solid biomass import: "#7a9a4a"
  # no methanol map: PatEx has no methanol ships (Q14), so the methanol balance of
  # PatEx countries is empty and PyPSA's explore() fails on it
  balance_map_interactive:
    bus_carriers:
    - AC
    - co2_stored
    - gas
    - H2
    - oil
    - urban_central_heat
